<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Semaphore Lab — Belajar & Penerjemah</title>
<style>
:root{--bg:#f4f7f2;--paper:#fff;--ink:#17251f;--muted:#66756d;--line:#e2e9e3;--green:#176b4b;--green2:#0f5138;--lime:#d9f99d;--gold:#f2b84b;--red:#c94b4b;--shadow:0 14px 38px #183b2910}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:#10251f;color:white;position:sticky;top:0;z-index:10;box-shadow:0 5px 20px #0002}.topin{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{font-weight:900;font-size:1.2rem;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}.flag{background:var(--lime);color:#10251f;border-radius:10px;padding:7px 9px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{border:0;background:transparent;color:#c9d7ce;padding:9px 13px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:#254337;color:white}.wrap{max-width:1120px;margin:auto;padding:28px 22px 60px}.hero{background:linear-gradient(120deg,#123b2d,#1e7651);border-radius:24px;color:white;padding:38px;display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:center;box-shadow:var(--shadow)}.eyebrow{color:var(--lime);font-size:.78rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,4vw,3.5rem);line-height:1.05;letter-spacing:-.05em;margin:12px 0}.hero p{color:#d5e5da;max-width:620px;line-height:1.7}.hero-art{display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;min-height:210px}.hero-art .big{font-size:6rem}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 16px;border-radius:11px;font-weight:800}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px #0001}.btn.primary{background:var(--lime);border-color:var(--lime);color:#183326}.btn.dark{background:var(--green);border-color:var(--green);color:white}.btn.ghost{background:#ffffff14;color:white;border-color:#ffffff40}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 15px}.section-head h2{margin:0;font-size:1.45rem;letter-spacing:-.03em}.section-head p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile,.panel,.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.tile{cursor:pointer;transition:.2s}.tile:hover{transform:translateY(-3px);border-color:#a9c9b5}.tile .ico{font-size:1.8rem}.tile h3{margin:10px 0 5px}.tile p{color:var(--muted);line-height:1.55;margin:0}.panel{margin-top:18px}.muted{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:180px}.field label{font-size:.83rem;font-weight:800;color:#405148}.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b4b18}.alphabet{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:18px}.letter{background:white;border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center;cursor:pointer}.letter:hover,.letter.selected{border-color:var(--green);box-shadow:0 0 0 2px #176b4b18}.letter svg{width:78px;height:82px;display:block;margin:auto}.letter b{color:var(--green);font-size:1.1rem}.figure{background:linear-gradient(#f0f7f1,#fff);border:1px solid #dce9df;border-radius:18px;display:grid;place-items:center;min-height:260px;padding:10px}.figure svg{max-width:100%;height:auto}.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.detail h2{font-size:2.5rem;color:var(--green);margin:0}.pill{display:inline-block;border-radius:99px;background:#eaf4ec;color:var(--green);padding:5px 10px;font-size:.78rem;font-weight:800}.notice{padding:12px 14px;border-radius:12px;background:#fff8e8;color:#72521c;line-height:1.5;margin-top:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.output-strip{display:flex;gap:8px;overflow:auto;padding:8px 2px}.output-item{min-width:105px;text-align:center;background:#f5faf5;border:1px solid var(--line);border-radius:13px;padding:8px}.output-item svg{width:85px;height:90px}.output-item strong{display:block;color:var(--green)}.quizfigure{max-width:340px;margin:14px auto}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.answers button{font-size:1.2rem;padding:17px}.feedback{font-weight:800;margin-top:14px;min-height:24px}.good{color:var(--green)}.bad{color:var(--red)}.progressbar{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--green);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:1.7rem;display:block;color:var(--green)}.stat small{color:var(--muted)}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:.82rem;padding:24px 0}.tiny{font-size:.8rem}.mono{font-variant-numeric:tabular-nums}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:27px}.hero-art{min-height:130px}.hero-art .big{font-size:4rem}.grid{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.answers{grid-template-columns:repeat(2,1fr)}.topin{align-items:flex-start}.nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.wrap{padding:20px 14px 45px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="topin">
 <div class="brand"><span class="flag">⚑</span> SEMAPHORE <span style="font-weight:500;color:#a9c4b4">LAB</span></div>
 <nav class="nav" id="nav">
  <button data-page="home" class="active">Beranda</button><button data-page="learn">Belajar A–Z</button><button data-page="translate">Penerjemah</button><button data-page="decode">Baca Pesan</button><button data-page="quiz">Latihan</button><button data-page="progress">Progres</button>
 </nav>
</div></header>
<main class="wrap" id="app"></main>
<footer class="footer">Semaphore Lab · Media latihan semaphore untuk Pramuka</footer>
<script>
/* Sudut dipertahankan dari tabel referensi awal. Lengan kanan pengirim tampil di sisi kiri layar. */
const DATA={
A:{r:225,l:180},B:{r:270,l:180},C:{r:315,l:180},D:{r:0,l:180},E:{r:180,l:45},F:{r:180,l:90},G:{r:180,l:135},
H:{r:270,l:225},I:{r:315,l:225},J:{r:0,l:90},K:{r:225,l:0},L:{r:225,l:45},M:{r:225,l:90},N:{r:225,l:135},
O:{r:270,l:315},P:{r:270,l:0},Q:{r:270,l:45},R:{r:270,l:90},S:{r:270,l:135},T:{r:315,l:0},U:{r:315,l:45},
V:{r:0,l:135},W:{r:45,l:90},X:{r:135,l:45},Y:{r:315,l:90},Z:{r:135,l:90},' ':{r:225,l:135}
};
const LETTERS=Object.keys(DATA).filter(x=>x!==' ');
const WORDS=['PRAMUKA','INDONESIA','SEMAPHORE','TUNAS KELAPA','SALAM PRAMUKA','SIAP','PENEGAK'];
const state={page:'home',selected:'A',filter:'',text:'PRAMUKA',index:0,playing:false,playTimer:null,quiz:null,score:0,streak:0,progress:load()};
function load(){try{return JSON.parse(localStorage.getItem('semaphore_lab_progress')||'{}')}catch{return {}}}
function save(){localStorage.setItem('semaphore_lab_progress',JSON.stringify(state.progress))}
function svg(ch,size=220){
 const d=DATA[ch]||DATA[' '];
 return `<svg viewBox="0 0 300 300" width="${size}" height="${size}" role="img" aria-label="Posisi semaphore ${ch===' '?'spasi':ch}">
 <line x1="150" y1="150" x2="150" y2="240" stroke="#176b4b" stroke-width="12" stroke-linecap="round"/>
 <line x1="150" y1="240" x2="120" y2="290" stroke="#176b4b" stroke-width="12" stroke-linecap="round"/><line x1="150" y1="240" x2="180" y2="290" stroke="#176b4b" stroke-width="12" stroke-linecap="round"/>
 <circle cx="150" cy="115" r="25" fill="#d9f2df" stroke="#176b4b" stroke-width="6"/>
 <g transform="rotate(${d.r},135,150)"><line x1="135" y1="150" x2="135" y2="60" stroke="#176b4b" stroke-width="10" stroke-linecap="round"/><path d="M135 60H90V90H135Z" fill="#d94848" stroke="#173328" stroke-width="2"/><path d="M135 60H112.5V90H135Z" fill="#f2b84b"/></g>
 <g transform="rotate(${d.l},165,150)"><line x1="165" y1="150" x2="165" y2="60" stroke="#176b4b" stroke-width="10" stroke-linecap="round"/><path d="M165 60H120V90H165Z" fill="#d94848" stroke="#173328" stroke-width="2"/><path d="M165 60H142.5V90H165Z" fill="#f2b84b"/></g></svg>`;
}
function go(page){stopPlay();state.page=page;render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function home(){return `<section class="hero"><div><div class="eyebrow">Belajar · Latihan · Komunikasi</div><h1>Kuasai semaphore,<br>selangkah demi selangkah.</h1><p>Kenali posisi bendera A–Z, ubah tulisan menjadi gerakan semaphore, dan pecahkan pesan yang ditampilkan. Belajar dengan ritme sendiri lalu ukur perkembanganmu.</p><div class="hero-actions"><button class="btn primary" onclick="go('learn')">Mulai belajar →</button><button class="btn ghost" onclick="go('decode')">Coba baca pesan</button></div></div><div class="hero-art"><div class="big">🚩</div></div></section>
<div class="section-head"><div><h2>Mulai dari sini</h2><p>Pilih aktivitas yang ingin kamu kuasai.</p></div></div>
<div class="grid">
 <article class="tile" onclick="go('learn')"><div class="ico">🔤</div><h3>Kamus A–Z</h3><p>Pelajari bentuk setiap huruf dan lihat posisi kedua bendera dengan jelas.</p></article>
 <article class="tile" onclick="go('translate')"><div class="ico">✍️</div><h3>Teks ke Semaphore</h3><p>Ketik pesan lalu tampilkan gerakannya satu per satu atau otomatis.</p></article>
 <article class="tile" onclick="go('decode')"><div class="ico">🧩</div><h3>Baca Pesan Semaphore</h3><p>Lihat rangkaian bendera, amati hurufnya, lalu tulis pesan yang kamu baca.</p></article>
</div>
<div class="panel"><div class="row between"><div><h3 style="margin:0 0 5px">Tips latihan</h3><span class="muted">Jangan hanya menghafal bentuk—latih pengenalan secara acak.</span></div><span class="pill">A–Z</span></div></div>`}
function learn(){let letters=LETTERS.filter(x=>x.includes(state.filter.toUpperCase()));let ch=state.selected;return `<div class="section-head"><div><h2>Kamus Semaphore</h2><p>Pilih huruf untuk melihat posisi benderanya.</p></div><span class="pill">26 huruf</span></div>
<div class="panel"><div class="detail"><div class="figure">${svg(ch,250)}</div><div><span class="pill">Huruf terpilih</span><h2>${ch}</h2><p class="muted">Perhatikan arah kedua lengan dan posisi bendera. Gunakan ilustrasi sebagai referensi visual saat berlatih.</p><p><b>Sudut referensi:</b><br>Lengan kanan: ${DATA[ch].r}°<br>Lengan kiri: ${DATA[ch].l}°</p><button class="btn dark" onclick="randomLetter()">Huruf acak ↻</button></div></div>
<div class="field" style="margin-top:20px"><label for="searchLetter">Cari huruf</label><input id="searchLetter" placeholder="Ketik A sampai Z..." value="${state.filter}" oninput="state.filter=this.value;document.getElementById('alphabet').innerHTML=alphabetHTML()"></div>
<div class="alphabet" id="alphabet">${alphabetHTML()}</div></div>`}
function alphabetHTML(){return LETTERS.filter(x=>x.includes(state.filter.toUpperCase())).map(x=>`<button class="letter ${x===state.selected?'selected':''}" onclick="state.selected='${x}';render()">${svg(x,70)}<b>${x}</b></button>`).join('')||'<p class="muted">Huruf tidak ditemukan.</p>'}
function randomLetter(){state.selected=LETTERS[Math.floor(Math.random()*26)];render()}
function translate(){let chars=[...state.text];let ch=chars[state.index]||' ';return `<div class="section-head"><div><h2>Penerjemah Teks</h2><p>Ubah pesan menjadi rangkaian gerakan semaphore.</p></div><span class="pill">Teks → Bendera</span></div><div class="panel">
<div class="row"><div class="field"><label for="message">Pesan (huruf A–Z dan spasi)</label><input id="message" maxlength="40" value="${escapeHTML(state.text)}" placeholder="Contoh: SALAM PRAMUKA"></div><button class="btn dark" style="align-self:end" onclick="setMessage()">Tampilkan</button></div>
<div class="notice">Gunakan huruf A–Z. Tanda baca dan angka tidak ditampilkan sebagai kode pada versi latihan ini.</div>
${chars.length?`<div class="detail" style="margin-top:20px"><div class="figure" id="currentFigure">${svg(ch,230)}</div><div><span class="pill">Gerakan ${state.index+1} dari ${chars.length}</span><h2 style="font-size:2.3rem;margin:10px 0">${ch===' '?'SPASI':ch}</h2><p class="muted">Amati posisi bendera, kemudian lanjutkan ke huruf berikutnya.</p><div class="row"><button class="btn" onclick="step(-1)">← Sebelumnya</button><button class="btn dark" onclick="step(1)">Berikutnya →</button></div><div class="row" style="margin-top:10px"><button class="btn primary" id="playBtn" onclick="togglePlay()">${state.playing?'Jeda':'▶ Putar otomatis'}</button><label class="tiny muted">Kecepatan <input type="range" min="500" max="2000" step="100" value="${state.speed||1100}" oninput="state.speed=+this.value;if(state.playing){stopPlay();togglePlay()}"> ${((state.speed||1100)/1000).toFixed(1)} dtk</label></div></div></div>
<div class="output-strip">${chars.map((c,i)=>`<div class="output-item" style="${i===state.index?'border:2px solid var(--green)':''}" onclick="state.index=${i};render()">${svg(c,82)}<strong>${c===' '?'SPASI':c}</strong></div>`).join('')}</div>`:''}
</div>`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMessage(){let el=document.getElementById('message');let v=el.value.toUpperCase().replace(/[^A-Z ]/g,'').replace(/\s+/g,' ').trim();if(!v){alert('Masukkan pesan berisi huruf A–Z.');return}state.text=v;state.index=0;render()}
function step(n){state.index=Math.max(0,Math.min(state.text.length-1,state.index+n));render()}
function stopPlay(){if(state.playTimer)clearInterval(state.playTimer);state.playTimer=null;state.playing=false}
function togglePlay(){if(state.playing){stopPlay();render();return}if(state.index>=state.text.length-1)state.index=0;state.playing=true;render();state.playTimer=setInterval(()=>{if(state.index<state.text.length-1){state.index++;render()}else{stopPlay();render()}},state.speed||1100)}
function decode(){if(!state.decodeWord)state.decodeWord=WORDS[Math.floor(Math.random()*WORDS.length)];return `<div class="section-head"><div><h2>Baca Pesan Semaphore</h2><p>Latih kemampuan membaca rangkaian huruf yang diberikan.</p></div><span class="pill">Bendera → Teks</span></div><div class="panel"><div class="row between"><div><b>Pesan untuk dipecahkan</b><p class="muted tiny">Amati setiap gambar dari kiri ke kanan, lalu tulis kata atau kalimatnya.</p></div><button class="btn" onclick="newDecode()">Pesan baru ↻</button></div><div class="output-strip" style="justify-content:center;flex-wrap:wrap">${[...state.decodeWord].map(c=>`<div class="output-item">${svg(c,100)}<strong>?</strong></div>`).join('')}</div><div class="row" style="margin-top:18px"><div class="field"><label for="decodeAnswer">Jawabanmu</label><input id="decodeAnswer" placeholder="Ketik pesan yang kamu baca..." onkeydown="if(event.key==='Enter')checkDecode()"></div><button class="btn dark" style="align-self:end" onclick="checkDecode()">Periksa jawaban</button></div><div id="decodeFeedback" class="feedback"></div><div class="notice">Petunjuk: spasi ditampilkan sebagai posisi istirahat. Perhatikan bahwa gambar merupakan ilustrasi posisi bendera, bukan foto gerakan manusia.</div></div>`}
function newDecode(){state.decodeWord=WORDS[Math.floor(Math.random()*WORDS.length)];render()}
function checkDecode(){let val=(document.getElementById('decodeAnswer').value||'').toUpperCase().trim().replace(/\s+/g,' '),fb=document.getElementById('decodeFeedback');if(val===state.decodeWord){fb.className='feedback good';fb.textContent='Benar! Kamu berhasil membaca pesan.';state.decodeCorrect=(state.decodeCorrect||0)+1}else{fb.className='feedback bad';fb.textContent='Belum tepat. Coba amati lagi setiap posisi bendera.'}}
function newQuiz(){let correct=LETTERS[Math.floor(Math.random()*26)],opts=[correct];while(opts.length<4){let x=LETTERS[Math.floor(Math.random()*26)];if(!opts.includes(x))opts.push(x)}state.quiz={correct,opts:opts.sort(()=>Math.random()-.5),answered:false}}
function quiz(){if(!state.quiz)newQuiz();let q=state.quiz;return `<div class="section-head"><div><h2>Latihan Cepat</h2><p>Kenali huruf dari posisi bendera. Jawab sebanyak mungkin.</p></div><span class="pill">Skor ${state.score}</span></div><div class="panel" style="text-align:center"><div class="row between"><b>🔥 Rentetan benar: ${state.streak}</b><span class="muted tiny">Skor tersimpan selama sesi ini</span></div><div class="figure quizfigure">${svg(q.correct,245)}</div><h3>Huruf apakah yang ditunjukkan?</h3><div class="answers">${q.opts.map(x=>`<button class="btn" ${q.answered?'disabled':''} onclick="answerQuiz('${x}',this)">${x}</button>`).join('')}</div><div id="quizFeedback" class="feedback"></div><button class="btn dark" style="margin-top:12px" onclick="newQuiz();render()">Soal berikutnya →</button></div>`}
function answerQuiz(x,btn){let q=state.quiz;if(q.answered)return;q.answered=true;let ok=x===q.correct;let fb=document.getElementById('quizFeedback');if(ok){state.score+=10;state.streak++;btn.classList.add('good');fb.className='feedback good';fb.textContent='✓ Tepat! +10 poin.'}else{state.streak=0;btn.classList.add('bad');fb.className='feedback bad';fb.textContent='Belum tepat. Jawaban yang benar: '+q.correct}let p=state.progress[q.correct]||{correct:0,wrong:0};p[ok?'correct':'wrong']++;state.progress[q.correct]=p;save();document.querySelectorAll('.answers button').forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.style.borderColor='var(--green)'})}
function progress(){let good=0,wrong=0,master=0;LETTERS.forEach(l=>{let p=state.progress[l]||{correct:0,wrong:0};good+=p.correct;wrong+=p.wrong;if(p.correct>=5)master++});let total=good+wrong,acc=total?Math.round(good/total*100):0;return `<div class="section-head"><div><h2>Progres Belajar</h2><p>Catatan hasil latihan tersimpan di perangkat ini.</p></div><span class="pill">Lokal</span></div><div class="stats"><div class="stat"><strong>${master}/26</strong><small>Huruf dikuasai (≥5 benar)</small></div><div class="stat"><strong>${acc}%</strong><small>Akurasi latihan</small></div><div class="stat"><strong>${total}</strong><small>Total jawaban</small></div></div><div class="panel"><h3>Penguasaan setiap huruf</h3><div class="alphabet">${LETTERS.map(l=>{let p=state.progress[l]||{correct:0,wrong:0};let cls=p.correct>=5?'good':p.correct?'':'muted';return `<div class="letter"><b>${l}</b><div class="tiny ${cls}">${p.correct||0} benar</div><div class="tiny muted">${p.wrong||0} salah</div></div>`}).join('')}</div><button class="btn" style="margin-top:18px" onclick="resetProgress()">Reset progres</button></div>`}
function resetProgress(){if(confirm('Hapus seluruh progres latihan?')){state.progress={};save();render()}}
function render(){let views={home,learn,translate,decode,quiz,progress};document.getElementById('app').innerHTML=views[state.page]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
state.speed=1100;render();
</script>
</body></html>
